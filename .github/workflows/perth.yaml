name: Perth CI workflow

defaults:
  run:
    shell: bash
    working-directory: ./

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/perth.yaml"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/perth.yaml"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
jobs:
  lints:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          python-version: "3.13"
          activate-environment: 'true'
      - name: Install project
        run: uv sync --all-groups
      - name: Lints / Type Checking
        run: make lint

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          python-version: "3.13"
          activate-environment: 'true'
      - name: Install project
        run: uv sync --all-groups --all-extras
      - name: Unit and Integration Tests
        run: make test

  publish:
    runs-on: ubuntu-latest
    needs: [tests]
    # only publish off main branch
    if: github.repository == 'resemble-ai/Perth' && github.ref == 'refs/heads/master'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          python-version: "3.13"
          activate-environment: 'true'
      - name: Install project
        run: uv sync --all-groups
      - name: build
        run: uv build
      - name: Publish
        run: uv publish
